<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Overflow check (temporary diagnostic)</title>
<style>
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0;padding:16px;background:#0f1225;color:#e8ecff}
  h1{font-size:1.15rem;margin:0 0 4px}
  p.sub{color:#9aa3c8;font-size:.86rem;margin:0 0 14px}
  button{background:#F7A325;color:#3a2600;border:0;border-radius:999px;padding:12px 20px;font-size:1rem;font-weight:700;cursor:pointer}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input{background:#1b2040;border:1px solid #333c66;color:#e8ecff;border-radius:8px;padding:9px 11px;font-size:.9rem;width:90px}
  .page{margin:14px 0;padding:12px;background:#171b36;border-radius:10px}
  .page h2{font-size:.92rem;margin:0 0 6px;color:#cdd4ff;word-break:break-all}
  .ok{color:#6BE3A2}
  .bad{color:#FF8B8B}
  .hit{font-family:ui-monospace,Menlo,monospace;font-size:.76rem;background:#0d1029;padding:7px 9px;border-radius:6px;margin:5px 0;word-break:break-all;border-left:3px solid #FF8B8B}
  .w{color:#F7A325;font-weight:700}
  iframe{position:fixed;left:-9999px;top:0;border:0}
  #out{margin-top:10px}
  .note{font-size:.8rem;color:#8189b5;margin-top:18px;border-top:1px solid #2a3160;padding-top:12px}
</style>
</head>
<body>

<h1>Overflow check</h1>
<p class="sub">Finds any element wider than the screen. Temporary diagnostic &mdash; safe to delete afterwards.</p>

<div class="row">
  <label style="font-size:.85rem;color:#9aa3c8">Width <input id="w" type="number" value="360"></label>
  <button id="go">Run check</button>
</div>

<div id="out"></div>

<p class="note">Tip: 360 is the narrowest common Android. Try 390 for iPhone. Tap a page name to open it normally.</p>

<script>
var PAGES = [
  'index.html','index-ms.html','guides.html','guide-dyslexia.html','guide-adhd.html',
  'screening-check.html','screening-check-ms.html','adhd-support.html','lodestone-evo.html','for-schools.html'
];

function describe(el){
  var t = el.tagName.toLowerCase();
  var c = (el.className && typeof el.className === 'string') ? '.' + el.className.trim().split(/\s+/).slice(0,3).join('.') : '';
  var i = el.id ? '#' + el.id : '';
  return t + i + c;
}

function checkDoc(doc, win, limit){
  var hits = [], all = doc.body.getElementsByTagName('*');
  for (var i = 0; i < all.length; i++){
    var el = all[i];
    var cs = win.getComputedStyle(el);
    if (cs.position === 'fixed') continue;          /* fixed boxes cannot widen the page */
    if (cs.display === 'none' || cs.visibility === 'hidden') continue;
    var r = el.getBoundingClientRect();
    if (r.width === 0) continue;
    var right = r.right + win.scrollX;
    if (right > limit + 1 || r.width > limit + 1){
      /* ignore an element whose parent already reported the same overflow */
      hits.push({ el: el, right: Math.round(right), width: Math.round(r.width) });
    }
  }
  /* keep only the outermost offenders, they are the real cause */
  return hits.filter(function(h){
    return !hits.some(function(o){ return o !== h && o.el.contains(h.el); });
  }).slice(0, 12);
}

document.getElementById('go').onclick = function(){
  var limit = parseInt(document.getElementById('w').value, 10) || 360;
  var out = document.getElementById('out');
  out.innerHTML = '';
  PAGES.forEach(function(p){
    var box = document.createElement('div');
    box.className = 'page';
    box.innerHTML = '<h2><a href="' + p + '" style="color:#cdd4ff">' + p + '</a></h2><span style="color:#9aa3c8;font-size:.82rem">checking…</span>';
    out.appendChild(box);

    var f = document.createElement('iframe');
    f.width = limit; f.height = 900; f.src = p;
    document.body.appendChild(f);
    f.onload = function(){
      var msg;
      try {
        var d = f.contentDocument, w = f.contentWindow;
        var docW = Math.round(d.documentElement.scrollWidth);
        var hits = checkDoc(d, w, limit);
        if (docW <= limit + 1 && !hits.length){
          msg = '<span class="ok">✓ fits — no horizontal overflow</span>';
        } else {
          msg = '<span class="bad">✗ page scrolls to <span class="w">' + docW + 'px</span> in a ' + limit + 'px screen</span>';
          hits.forEach(function(h){
            msg += '<div class="hit">' + describe(h.el) +
                   '<br>width <span class="w">' + h.width + 'px</span>, right edge at <span class="w">' + h.right + 'px</span></div>';
          });
          if (!hits.length) msg += '<div class="hit">no single element identified — likely a margin or a fixed bar</div>';
        }
      } catch(e){
        msg = '<span class="bad">could not read this page (' + e.message + ')</span>';
      }
      box.innerHTML = '<h2><a href="' + p + '" style="color:#cdd4ff">' + p + '</a></h2>' + msg;
      f.remove();
    };
  });
};
</script>
</body>
</html>
